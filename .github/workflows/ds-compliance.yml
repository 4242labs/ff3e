name: DS compliance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (the Gate-3 primitive diff resolves through shadcn)
        run: npm ci

      - name: Install provenance gate dependency
        working-directory: .
        run: python -m pip install pytest

      - name: Fetch the design-system check (it lives in the private DS repo)
        uses: actions/checkout@v4
        with:
          repository: 4242labs/design-system
          ref: b50195995e855851c58c00bee988a8b97d0c2163 # immutable DS 2.4.3 component contract commit
          token: ${{ secrets.DS_ACTION_TOKEN }} # org secret: a Contents:read PAT
          path: web/.ds-action

      # Run the check from `web/` (not via the composite action) so shadcn's
      # Gate-3 resolve sees this app's components.json. The action's own step
      # runs from the repo root, which has no components.json in a web/ monorepo.
      - name: DS compliance — tokens, primitives, own-code drift
        run: node .ds-action/.github/actions/ds-compliance/consumer-check.mjs
        env:
          DS_TOKENS_PIN: "2.4.3"
          DS_EXPECTED_COMMIT: "b50195995e855851c58c00bee988a8b97d0c2163"
          DS_TOKENS_FILE: "src/ds-tokens.css"
          DS_UI_DIR: "src/components/ui"
          DS_SCAN: "src"

      - name: Exact component and artifact provenance contract
        working-directory: .
        run: DS_CANDIDATE="$PWD/web/.ds-action" python -m pytest -q tests/test_ds_contract.py

      - name: Install browser for accessibility gate
        run: npx playwright install --with-deps chromium

      - name: Build browser candidate
        run: npm run build:demo

      - name: Start browser candidate
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Browser accessibility and overflow gate
        run: npm run test:browser:a11y
