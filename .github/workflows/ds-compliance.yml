name: DS compliance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (the Gate-3 primitive diff resolves through shadcn)
        run: npm ci

      - name: Install provenance gate dependency
        working-directory: .
        run: python -m pip install pytest

      # CHECKER MODE. The check comes from public npm, not from a checkout of the private
      # design-system repository, so no credential is read here — `DS_ACTION_TOKEN` is gone.
      # The tokens are still vendored in this repository and still pinned: `--tokens-file`
      # is the copy, and the checker compares it against the tokens it ships itself.
      #
      # That is why `--expect` equals the checker version. The reference and the checker are
      # one artifact, so a checker cannot vouch for a version it does not carry. Moving the
      # pin therefore means moving both, and it is a deliberate re-vendor — here, 2.4.4 to
      # 2.4.7, whose token values are identical, so nothing renders differently.
      #
      # No NODE_AUTH_TOKEN, no NPM_TOKEN, no .npmrc: the package is public and has to resolve
      # anonymously from a public repository. If that ever stops being true, it fails here.
      - name: DS compliance — vendored tokens, own-code drift
        run: |
          npx --yes --package=@4242labs/design-system@2.4.7 -- \
            42labs-ds-check --scan src --expect 2.4.7 \
              --tokens-file src/ds-tokens.css --ui-dir src/components/ui

      - name: Exact component and artifact provenance contract
        working-directory: .
        run: python -m pytest -q tests/test_ds_contract.py

      - name: Install browser for accessibility gate
        run: npx playwright install --with-deps chromium

      - name: Build browser candidate
        run: npm run build:demo

      - name: Start browser candidate
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Browser accessibility and overflow gate
        run: npm run test:browser:a11y
